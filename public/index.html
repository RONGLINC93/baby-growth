<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝成长记录</title>
<script src="lib/html2canvas.min.js"></script>
<!-- 版权信息 -->
 <meta name="copyright" content="© 2026 RONGLINC93 版权所有">
 <!-- 作者信息 -->
 <meta name="author" content="RONGLINC93">
 <!-- 描述信息 -->
 <meta name="description" content="宝宝成长记录 - 一个基于 Node.js 的照片管理工具">
 <!-- 关键字信息 -->
 <meta name="keywords" content="宝宝成长记录,照片管理工具,Node.js">

<style>
  :root{
    --bg1:#fdf6f0; --bg2:#fef3e7;
    --primary:#ff8fa3; --accent:#ffb86c; --text:#5a4a4a; --muted:#9b8a8a;
    --shadow:0 10px 30px rgba(255,143,163,.25);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
  body{cursor:default}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,Segoe UI,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 20% 20%,rgba(255,184,108,.22),transparent 45%),
               radial-gradient(circle at 80% 75%,rgba(255,143,163,.22),transparent 45%);
  }
  header{position:fixed;top:24px;left:28px;z-index:20;pointer-events:none}
  header h1{
    font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;letter-spacing:1px;
    background:linear-gradient(120deg,var(--primary),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{margin-top:4px;color:var(--muted);font-size:.9rem}
  .author{
    position:fixed;bottom:24px;left:28px;z-index:0;
    color:var(--muted);font-size:.78rem;letter-spacing:1px;
    pointer-events:none;user-select:none;
  }
  .stage{position:fixed;inset:0;z-index:1;pointer-events:none}

  .bubble{
    position:absolute;top:0;left:0;
    border-radius:50%;cursor:pointer;pointer-events:auto;
    background:#f0e6e0;
    box-shadow:0 0 0 5px #fff,var(--shadow);
    transition:transform .3s ease,box-shadow .3s ease;
    will-change:transform,left,top;
  }
  .bubble img{
    width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;
    border-radius:50%;
  }
  .bubble:hover{transform:scale(1.12);box-shadow:0 0 0 6px #fff,0 18px 45px rgba(255,143,163,.45);z-index:50}
  .bubble .badge{
    position:absolute;top:6px;left:50%;transform:translateX(-50%);
    background:rgba(255,143,163,.55);backdrop-filter:blur(4px);
    color:#fff;font-weight:700;font-size:.78rem;padding:3px 12px;border-radius:999px;
    z-index:2;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bubble .tip{
    position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
    background:rgba(90,74,74,.92);color:#fff;font-size:.78rem;padding:4px 12px;
    border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .bubble:hover .tip{opacity:1}
  .bubble .del-btn{
    position:absolute;top:-2px;right:-2px;
    background:rgba(255,80,80,.92);color:#fff;border:none;width:28px;height:28px;
    border-radius:50%;font-size:1rem;cursor:pointer;opacity:0;transition:opacity .3s;
    z-index:3;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .bubble:hover .del-btn{opacity:1}

  .controls{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    z-index:30;display:flex;gap:12px;align-items:center;
    background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
    padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);
    flex-wrap:wrap;justify-content:center;
  }
  .controls button{
    border:none;background:linear-gradient(120deg,var(--primary),var(--accent));
    color:#fff;font-weight:600;font-size:.9rem;padding:8px 18px;border-radius:999px;
    cursor:pointer;transition:transform .2s;
  }
  .controls button:hover{transform:scale(1.05)}
  .controls button.sec{background:#fff;color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .controls .info{font-size:.82rem;color:var(--muted);padding:0 6px}
  .controls .speed-group{display:inline-flex;align-items:center;gap:4px}
  .controls input[type=range]{width:120px;accent-color:var(--primary)}

  /* 弹窗：新增/编辑 */
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
    align-items:center;justify-content:center;z-index:200;padding:20px;
  }
  .modal.show{display:flex}
  .modal .box{
    background:#fff;border-radius:var(--radius);padding:28px;width:420px;max-width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal h3{margin-bottom:18px;color:var(--text)}
  .modal label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
  .modal input[type=text],.modal input[type=number],.modal textarea{
    width:100%;padding:8px 12px;border:1px solid #e0d0d0;border-radius:8px;
    font-family:inherit;font-size:.92rem;color:var(--text);
  }
  .modal textarea{resize:vertical;min-height:70px}
  .modal .file-row{
    border:2px dashed var(--primary);border-radius:10px;padding:20px;
    text-align:center;color:var(--muted);cursor:pointer;font-size:.9rem;
    background:#fff8f8;
  }
  .modal .file-name{margin-top:8px;font-size:.82rem;color:var(--primary);word-break:break-all}
  .modal .actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
  .modal .actions button{
    border:none;padding:8px 20px;border-radius:999px;cursor:pointer;
    font-weight:600;font-size:.9rem;
  }
  .modal .actions .save{background:linear-gradient(120deg,var(--primary),var(--accent));color:#fff}
  .modal .actions .cancel{background:#f0e0e0;color:var(--text)}
  .modal .preview{
    width:90px;height:90px;border-radius:50%;overflow:hidden;margin:8px auto;
    display:none;
  }
  .modal .preview img{width:100%;height:100%;object-fit:cover}

  /* Lightbox 大图 */
  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;
    flex-direction:column;align-items:center;justify-content:center;
    z-index:100;padding:20px 30px 30px;gap:16px;
  }
  .lightbox.show{display:flex}
  .lightbox img{max-width:92%;max-height:72vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lightbox .close{
    position:absolute;top:18px;right:28px;color:#fff;font-size:2.4rem;cursor:pointer;line-height:1;
  }
  .lightbox .caption{color:#fff;text-align:center;max-width:680px}
  .lightbox .caption .row{display:flex;align-items:center;gap:10px;margin-top:8px}
  .lightbox .caption .label{
    flex-shrink:0;font-size:.82rem;color:var(--accent);font-weight:600;
    min-width:2.5em;text-align:right;
  }
  .lightbox .caption .t{
    flex:1;font-size:1.1rem;font-weight:700;outline:none;padding:6px 12px;border-radius:8px;
    transition:background .2s;min-height:1.4em;text-align:left;
    user-select:text;-webkit-user-select:text;cursor:text;
    border:1px solid rgba(255,255,255,.15);
  }
  .lightbox .caption .t:focus{background:rgba(255,255,255,.12);border-color:var(--primary)}
  .lightbox .caption .d{
    flex:1;color:#d8c8c8;font-size:.92rem;outline:none;padding:8px 14px;
    border-radius:8px;transition:background .2s;min-height:1.4em;line-height:1.6;
    user-select:text;-webkit-user-select:text;cursor:text;text-align:left;
    border:1px solid rgba(255,255,255,.15);
  }
  .lightbox .caption .d:focus{background:rgba(255,255,255,.12);color:#fff;border-color:var(--primary)}
  .lightbox .caption .d:empty::before{content:'点击此处添加说明…';color:#888;font-style:italic}
  .lightbox .caption .t:empty::before{content:'点击此处添加标题…';color:#888;font-style:italic}
  .lb-save{
    margin-top:12px;border:none;padding:8px 22px;border-radius:999px;cursor:pointer;
    font-weight:600;font-size:.88rem;color:#fff;
    background:linear-gradient(120deg,var(--primary),var(--accent));
    transition:transform .2s,opacity .2s;opacity:1;
  }
  .lb-save:hover{transform:scale(1.05)}
  .lb-save.saved{opacity:.5}

  /* 右下角操作说明 */
  .help-panel{
    position:fixed;bottom:24px;right:24px;z-index:0;
    background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
    padding:14px 18px;border-radius:14px;box-shadow:var(--shadow);
    font-size:.82rem;color:var(--text);max-width:220px;
    transition:transform .3s,opacity .3s;
    pointer-events:auto;
  }
  .help-panel h4{
    font-size:.88rem;color:var(--primary);margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .help-panel h4 .toggle{cursor:pointer;font-size:1rem;color:var(--muted)}
  .help-panel ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .help-panel li{display:flex;align-items:center;gap:8px;line-height:1.4}
  .help-panel kbd{
    background:#fff;border:1px solid #e8d8d8;border-radius:5px;
    padding:1px 7px;font-size:.74rem;color:var(--primary);
    font-family:inherit;box-shadow:0 1px 0 #e8d8d8;min-width:18px;text-align:center;
    white-space:nowrap;
  }
  .help-panel.collapsed ul{display:none}
  .help-panel.collapsed{max-width:none}

  /* 确认删除模态框 */
  .confirm-modal{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
    align-items:center;justify-content:center;z-index:300;padding:20px;
  }
  .confirm-modal.show{display:flex}
  .confirm-modal .box{
    background:#fff;border-radius:var(--radius);padding:26px 28px;width:360px;max-width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;
  }
  .confirm-modal .icon{
    width:56px;height:56px;margin:0 auto 14px;border-radius:50%;
    background:#ffe5e5;display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;color:#ff5050;
  }
  .confirm-modal h3{font-size:1.1rem;margin-bottom:8px;color:var(--text)}
  .confirm-modal p{color:var(--muted);font-size:.9rem;margin-bottom:22px}
  .confirm-modal .actions{display:flex;gap:10px;justify-content:center}
  .confirm-modal .actions button{
    border:none;padding:9px 24px;border-radius:999px;cursor:pointer;
    font-weight:600;font-size:.92rem;min-width:90px;
  }
  .confirm-modal .actions .ok{background:linear-gradient(120deg,#ff5050,#ff8fa3);color:#fff}
  .confirm-modal .actions .cancel{background:#f0e0e0;color:var(--text)}
</style>
</head>
<body>

<header>
  <h1 id="siteTitle">宝宝成长记录</h1>
  <p id="siteDesc">每一张照片，都是一段小小的奇迹 ✨</p>
</header>

<footer class="author">© 2026 RONGLINC93 版权所有</footer>

<div class="stage" id="stage"></div>

<div class="controls">
  <button id="toggleBtn">暂停跳动</button>
  <span class="info speed-group">速度<span id="speedVal">5</span></span>
  <input type="range" id="speed" min="1" max="10" value="5">
  <button class="sec" id="shuffleBtn">重新散布</button>
  <button id="addBtn">添加照片</button>
  <button class="sec" id="screenshotBtn">截图</button>
  <button class="sec" id="settingsBtn">设置</button>
</div>

<div class="help-panel" id="helpPanel">
  <h4>操作说明 <span class="toggle" id="helpToggle">−</span></h4>
  <ul>
    <li><kbd>悬停</kbd> 照片停止跳动</li>
    <li><kbd>拖动</kbd> 移动照片位置</li>
    <li><kbd>滚轮</kbd> 放大缩小照片</li>
    <li><kbd>单击</kbd> 查看大图并编辑</li>
    <li><kbd>拖入</kbd> 图片自动添加</li>
    <li><kbd>Esc</kbd> 关闭弹窗</li>
  </ul>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal" id="editModal">
  <div class="box">
    <h3 id="modalTitle">添加照片</h3>
    <div class="preview" id="preview"><img id="previewImg" src=""></div>
    <label>选择图片</label>
    <div class="file-row" id="fileRow">点击或拖拽选择图片</div>
    <div class="file-name" id="fileName"></div>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <label>标题</label>
    <input type="text" id="titleInput" placeholder="如：第一次微笑" maxlength="50">
    <label>说明</label>
    <textarea id="descInput" placeholder="记录这一刻的故事..." maxlength="300"></textarea>
    <div class="actions">
      <button class="cancel" id="cancelBtn">取消</button>
      <button class="save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 设置模态框 -->
<div class="modal" id="settingsModal">
  <div class="box">
    <h3>网站设置</h3>
    <label>网站标题</label>
    <input type="text" id="siteTitleInput" placeholder="宝宝成长记录" maxlength="30">
    <label>说明文字</label>
    <input type="text" id="siteDescInput" placeholder="每一张照片，都是一段小小的奇迹 ✨" maxlength="60">
    <div class="actions">
      <button class="cancel" id="settingsCancelBtn">取消</button>
      <button class="save" id="settingsSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 确认删除模态框 -->
<div class="confirm-modal" id="confirmModal">
  <div class="box">
    <div class="icon">⚠</div>
    <h3 id="confirmTitle">确认删除？</h3>
    <p id="confirmText">删除后无法恢复</p>
    <div class="actions">
      <button class="cancel" id="confirmCancel">取消</button>
      <button class="ok" id="confirmOk">删除</button>
    </div>
  </div>
</div>

<!-- 大图预览 -->
<div class="lightbox" id="lightbox">
  <span class="close" id="closeBtn">&times;</span>
  <img id="lbImg" src="" alt="大图">
  <div class="caption">
    <div class="row"><span class="label">标题</span><div class="t" id="lbTitle" contenteditable="true" spellcheck="false" tabindex="0"></div></div>
    <div class="row"><span class="label">说明</span><div class="d" id="lbDesc" contenteditable="true" spellcheck="false" tabindex="0"></div></div>
    <button id="lbSaveBtn" class="lb-save">保存修改</button>
  </div>
</div>

<script>
const API = '/api/photos';
let photos = [];
let currentPhotoId = null;
const bubbles = [];
const rand = (min,max)=> Math.random()*(max-min)+min;

const stage = document.getElementById('stage');

// ---------- 加载数据（增量更新，保留现有布局） ----------
async function load(){
  const r = await fetch(API);
  photos = await r.json();
  const wasEmpty = bubbles.length === 0;
  render();
  if(wasEmpty) scatter();  // 仅首次加载时散布
}

function render(){
  // 收集当前数据的 id 集合
  const ids = new Set(photos.map(p => p.id));
  // 1. 移除已被删除的 bubble（不扰动其他）
  for(let i = bubbles.length - 1; i >= 0; i--){
    if(!ids.has(bubbles[i].photo.id)){
      bubbles[i].el.remove();
      bubbles.splice(i, 1);
    }
  }
  // 2. 更新现有 bubble 的数据，跳过新增的
  const existing = new Set(bubbles.map(b => b.photo.id));
  photos.forEach(p => {
    if(existing.has(p.id)){
      // 更新标题/说明（删除按钮、badge 等仍生效）
      const b = bubbles.find(b => b.photo.id === p.id);
      Object.assign(b.photo, p);
      b.el.querySelector('.badge').textContent = p.title;
      b.el.querySelector('.tip').textContent = p.desc;
    } else {
      // 新增的 bubble
      createBubble(p);
    }
  });
}

function createBubble(p){
  const size = Math.round(rand(65,230));
  const el = document.createElement('div');
  el.className = 'bubble';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.innerHTML = `
    <span class="badge">${p.title}</span>
    <img src="/${p.src}" alt="${p.title}">
    <span class="tip">${p.desc}</span>
    <button class="del-btn" title="删除">×</button>`;
  stage.appendChild(el);

  const b = {el, size, x:0, y:0, vx:rand(-1,1)||0.5, vy:rand(-1,1)||0.5, hovered:false, dragging:false, photo:p};
  bubbles.push(b);

  el.addEventListener('mouseenter', ()=>{ b.hovered = true; });
  el.addEventListener('mouseleave', ()=>{ if(!b.dragging) b.hovered = false; });
  el.addEventListener('wheel', e=>{
    e.preventDefault();
    const delta = e.deltaY > 0 ? -8 : 8;
    b.size = Math.max(50, Math.min(300, b.size + delta));
    b.el.style.width = b.size + 'px';
    b.el.style.height = b.size + 'px';
  }, {passive:false});
  el.addEventListener('mousedown', e=>{
    if(e.target.classList.contains('del-btn')) return;
    if(e.target.isContentEditable) return;  // 允许编辑框正常聚焦
    b.dragging = true; b.hovered = true;
    dragBub = b; dragMoved = false;
    lastMX = e.clientX; lastMY = e.clientY;
    el.style.cursor = 'grabbing';
    e.preventDefault();
  });
  el.addEventListener('click', e=>{
    if(dragMoved) return;
    if(e.target.classList.contains('del-btn')) return;
    currentPhotoId = p.id;
    document.getElementById('lbImg').src = '/' + p.src;
    document.getElementById('lbTitle').textContent = p.title;
    document.getElementById('lbDesc').textContent = p.desc;
    const saveBtn = document.getElementById('lbSaveBtn');
    saveBtn.classList.remove('saved');
    saveBtn.textContent = '保存修改';
    document.getElementById('lightbox').classList.add('show');
  });
  el.querySelector('.del-btn').addEventListener('click', async e=>{
    e.stopPropagation();
    showConfirm({
      title: '确认删除？',
      text: `将删除「${p.title}」，删除后无法恢复。`,
      onOk: async () => {
        await fetch(API + '/' + p.id, {method:'DELETE'});
        await load();
      }
    });
  });
}

function scatter(){
  const W = window.innerWidth, H = window.innerHeight;
  bubbles.forEach(b=>{
    b.x = rand(20, Math.max(40, W - b.size - 20));
    b.y = rand(70, Math.max(90, H - b.size - 90));
    b.vx = rand(-1.6,1.6) || 0.8;
    b.vy = rand(-1.6,1.6) || 0.8;
    b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
  });
}

// 拖拽
let dragBub = null, lastMX = 0, lastMY = 0, dragMoved = false;
document.addEventListener('mousemove', e=>{
  if(!dragBub) return;
  const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
  if(Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  dragBub.x = Math.max(0, Math.min(window.innerWidth - dragBub.size, dragBub.x + dx));
  dragBub.y = Math.max(60, Math.min(window.innerHeight - dragBub.size - 80, dragBub.y + dy));
  dragBub.el.style.transform = `translate(${dragBub.x}px, ${dragBub.y}px)`;
  lastMX = e.clientX; lastMY = e.clientY;
});
document.addEventListener('mouseup', ()=>{
  if(dragBub){
    dragBub.dragging = false;
    dragBub.el.style.cursor = 'pointer';
    dragBub = null;
  }
});

// 跳动循环
let running = true, speed = 1;
function loop(){
  if(running){
    const W = window.innerWidth, H = window.innerHeight;
    bubbles.forEach(b=>{
      if(b.hovered || b.dragging) return;
      b.x += b.vx * speed;
      b.y += b.vy * speed;
      if(b.x <= 0){ b.x=0; b.vx = Math.abs(b.vx); }
      if(b.x >= W - b.size){ b.x = W - b.size; b.vx = -Math.abs(b.vx); }
      if(b.y <= 60){ b.y=60; b.vy = Math.abs(b.vy); }
      if(b.y >= H - b.size - 80){ b.y = H - b.size - 80; b.vy = -Math.abs(b.vy); }
      b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
    });
  }
  requestAnimationFrame(loop);
}
loop();

// 控制按钮
document.getElementById('toggleBtn').addEventListener('click', e=>{
  running = !running;
  e.target.textContent = running ? '暂停跳动' : '继续跳动';
});
document.getElementById('speed').addEventListener('input', e=>{ speed = e.target.value / 5; document.getElementById('speedVal').textContent = e.target.value; });
document.getElementById('shuffleBtn').addEventListener('click', scatter);
window.addEventListener('resize', scatter);

// 操作说明折叠（状态保存到服务端）
const helpPanel = document.getElementById('helpPanel');
const helpToggle = document.getElementById('helpToggle');
let saveConfigTimer = null;
function applyHelpCollapsed(c){
  if(c){ helpPanel.classList.add('collapsed'); helpToggle.textContent = '+'; }
  else { helpPanel.classList.remove('collapsed'); helpToggle.textContent = '−'; }
}
function saveHelpCollapsed(c){
  clearTimeout(saveConfigTimer);
  saveConfigTimer = setTimeout(()=>{
    fetch('/api/config', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ helpCollapsed: c })
    }).catch(()=>{});
  }, 300);
}
helpToggle.addEventListener('click', ()=>{
  const collapsed = helpPanel.classList.toggle('collapsed');
  helpToggle.textContent = collapsed ? '+' : '−';
  saveHelpCollapsed(collapsed);
});
// 启动时读取保存的折叠状态
fetch('/api/config').then(r=>r.json()).then(cfg=>{
  if(cfg.helpCollapsed !== undefined) applyHelpCollapsed(cfg.helpCollapsed);
  // 应用保存的网站标题/说明
  if(cfg.siteTitle) document.getElementById('siteTitle').textContent = cfg.siteTitle;
  if(cfg.siteDesc) document.getElementById('siteDesc').textContent = cfg.siteDesc;
}).catch(()=>{});

// ---------- 设置模态框 ----------
const settingsModal = document.getElementById('settingsModal');
document.getElementById('settingsBtn').addEventListener('click', async ()=>{
  const cfg = await fetch('/api/config').then(r=>r.json()).catch(()=>({}));
  document.getElementById('siteTitleInput').value = cfg.siteTitle || document.getElementById('siteTitle').textContent;
  document.getElementById('siteDescInput').value = cfg.siteDesc || document.getElementById('siteDesc').textContent;
  settingsModal.classList.add('show');
});
document.getElementById('settingsCancelBtn').addEventListener('click', ()=> settingsModal.classList.remove('show'));
// 截图
document.getElementById('screenshotBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('screenshotBtn');
  const oldText = btn.textContent;
  btn.textContent = '截图中...'; btn.disabled = true;
  // 截图前临时移除会干扰的元素
  const helpPanel = document.getElementById('helpPanel');
  const controls = document.querySelector('.controls');
  const helpHide = helpPanel.style.display, ctrlHide = controls.style.display;
  helpPanel.style.display = 'none';
  controls.style.display = 'none';
  try{
    const canvas = await html2canvas(document.body, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      allowTaint: true,
      logging: false,
      windowWidth: document.documentElement.scrollWidth,
      windowHeight: document.documentElement.scrollHeight
    });
    // 合成背景渐变
    const final = document.createElement('canvas');
    final.width = canvas.width; final.height = canvas.height;
    const ctx = final.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, final.width, final.height);
    grad.addColorStop(0, '#fdf6f0');
    grad.addColorStop(1, '#fef3e7');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, final.width, final.height);
    ctx.drawImage(canvas, 0, 0);
    const link = document.createElement('a');
    link.download = `宝宝成长记录_${new Date().toISOString().slice(0,10)}.png`;
    link.href = final.toDataURL('image/png');
    link.click();
  }catch(e){
    alert('截图失败：' + e.message);
  }finally{
    helpPanel.style.display = helpHide;
    controls.style.display = ctrlHide;
    btn.textContent = oldText; btn.disabled = false;
  }
});
document.getElementById('settingsSaveBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('siteTitleInput').value.trim() || '宝宝成长记录';
  const desc = document.getElementById('siteDescInput').value.trim() || '每一张照片，都是一段小小的奇迹 ✨';
  await fetch('/api/config', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ siteTitle: title, siteDesc: desc })
  });
  document.getElementById('siteTitle').textContent = title;
  document.getElementById('siteDesc').textContent = desc;
  settingsModal.classList.remove('show');
});

// ---------- 新增/编辑弹窗 ----------
const modal = document.getElementById('editModal');
const fileInput = document.getElementById('fileInput');
const fileRow = document.getElementById('fileRow');
const fileName = document.getElementById('fileName');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
let selectedFile = null;

document.getElementById('addBtn').addEventListener('click', ()=>{
  selectedFile = null;
  fileInput.value = '';
  fileName.textContent = '';
  preview.style.display = 'none';
  document.getElementById('titleInput').value = '';
  document.getElementById('descInput').value = '';
  document.getElementById('modalTitle').textContent = '添加照片';
  modal.classList.add('show');
});
document.getElementById('cancelBtn').addEventListener('click', ()=> modal.classList.remove('show'));
fileRow.addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', e=>{
  selectedFile = e.target.files[0];
  if(!selectedFile) return;
  fileName.textContent = selectedFile.name;
  const reader = new FileReader();
  reader.onload = ev => { previewImg.src = ev.target.result; preview.style.display = 'block'; };
  reader.readAsDataURL(selectedFile);
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  if(!selectedFile){ alert('请选择图片'); return; }
  const fd = new FormData();
  fd.append('file', selectedFile);
  fd.append('title', document.getElementById('titleInput').value || '未命名');
  fd.append('desc', document.getElementById('descInput').value);
  const r = await fetch(API, { method:'POST', body:fd });
  if(r.ok){
    modal.classList.remove('show');
    await load();
  } else {
    alert('保存失败：' + await r.text());
  }
});

// 大图关闭
const lb = document.getElementById('lightbox');
document.getElementById('closeBtn').addEventListener('click', ()=> lb.classList.remove('show'));
lb.addEventListener('click', e=>{ if(e.target===lb) lb.classList.remove('show'); });
// 编辑框：点击时根据鼠标位置手动定位光标
['lbTitle','lbDesc'].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener('dragstart', e=> e.preventDefault());
  el.addEventListener('mousedown', e=>{
    e.preventDefault();  // 阻止浏览器默认（会全选或定位到0）
    el.focus();
    const x = e.clientX, y = e.clientY;
    const range = document.caretRangeFromPoint
      ? document.caretRangeFromPoint(x, y)
      : (document.caretPositionFromPoint ? (()=>{ const p=document.caretPositionFromPoint(x,y); const r=document.createRange(); r.setStart(p.offsetNode, p.offset); return r; })() : null);
    if(range){
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });
});

// 大图编辑保存
document.getElementById('lbSaveBtn').addEventListener('click', async ()=>{
  if(!currentPhotoId) return;
  const title = document.getElementById('lbTitle').textContent.trim();
  const desc = document.getElementById('lbDesc').textContent.trim();
  const r = await fetch(API + '/' + currentPhotoId, {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ title, desc })
  });
  if(r.ok){
    const btn = document.getElementById('lbSaveBtn');
    btn.classList.add('saved');
    btn.textContent = '已保存 ✓';
    await load();
  } else {
    alert('保存失败');
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ lb.classList.remove('show'); modal.classList.remove('show'); confirmModal.classList.remove('show'); settingsModal.classList.remove('show'); } });

// ---------- 确认删除模态框 ----------
const confirmModal = document.getElementById('confirmModal');
let confirmCb = null;
function showConfirm({title, text, onOk}){
  document.getElementById('confirmTitle').textContent = title || '确认删除？';
  document.getElementById('confirmText').textContent = text || '删除后无法恢复';
  confirmCb = onOk;
  confirmModal.classList.add('show');
}
document.getElementById('confirmCancel').addEventListener('click', ()=>{
  confirmModal.classList.remove('show');
  confirmCb = null;
});
document.getElementById('confirmOk').addEventListener('click', async ()=>{
  confirmModal.classList.remove('show');
  if(confirmCb){ await confirmCb(); confirmCb = null; }
});
confirmModal.addEventListener('click', e=>{ if(e.target===confirmModal){ confirmModal.classList.remove('show'); confirmCb = null; } });

// ---------- 禁用右键菜单 ----------
document.addEventListener('contextmenu', e=>{
  if(e.target.isContentEditable || ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  e.preventDefault();
});
// 框选通过 CSS user-select:none 禁用（编辑框用 user-select:text 覆盖）
document.addEventListener('dragstart', e=>{
  if(e.target.isContentEditable) { e.preventDefault(); return; }
  if(!e.dataTransfer.types.includes('Files')) e.preventDefault();
});

// 启动
load();
let dragCounter = 0;
const dropOverlay = document.createElement('div');
dropOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(255,143,163,.25);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:400;pointer-events:none;border:4px dashed #ff8fa3;';
dropOverlay.innerHTML = '<div style="background:#fff;padding:28px 44px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center"><div style="font-size:3rem">📥</div><div style="margin-top:10px;font-size:1.1rem;font-weight:700;color:#ff8fa3">松开鼠标即可添加</div><div style="margin-top:4px;font-size:.85rem;color:#9b8a8a">支持多张图片</div></div>';
document.body.appendChild(dropOverlay);

document.addEventListener('dragenter', e=>{
  e.preventDefault();
  if(e.dataTransfer && e.dataTransfer.types.includes('Files')){
    dragCounter++;
    dropOverlay.style.display = 'flex';
  }
});
document.addEventListener('dragover', e=>{ e.preventDefault(); });
document.addEventListener('dragleave', e=>{
  e.preventDefault();
  dragCounter--;
  if(dragCounter <= 0){ dragCounter = 0; dropOverlay.style.display = 'none'; }
});
document.addEventListener('drop', async e=>{
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.style.display = 'none';
  const files = [...(e.dataTransfer.files || [])].filter(f => f.type.startsWith('image/'));
  if(files.length === 0) return;
  for(const file of files){
    const fd = new FormData();
    fd.append('file', file);
    fd.append('title', file.name.replace(/\.[^.]+$/, '').slice(0, 50) || '未命名');
    fd.append('desc', '');
    await fetch(API, { method:'POST', body:fd });
  }
  await load();
});
</script>
</body>
